name: CI

on:
  push:
    branches: [main, 'claude/**', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Verify PWA output
        run: |
          test -f apps/web/dist/manifest.webmanifest
          test -f apps/web/dist/sw.js
          test -f apps/web/dist/icon-512.png
          test -f apps/web/dist/icon-maskable-512.png
          # Cloudflare Pages serves this: without it, a refresh on /calendar 404s.
          test -f apps/web/dist/_redirects
          grep -q 'rel="manifest"' apps/web/dist/index.html
          # The registration is in the entry bundle rather than in index.html, because main.tsx
          # imports virtual:pwa-register and vite-plugin-pwa then injects no script tag of its own.
          grep -rqs 'serviceWorker' apps/web/dist/assets/
          # navigateFallback has to name a precached entry, or offline never starts.
          grep -q 'index.html' apps/web/dist/sw.js
          # PDF.js must stay out of the entry chunk and inside the precache. Workbox silently drops
          # any file over its size limit, and the worker is the largest thing here by far — losing
          # it from the manifest would break PDF import offline with no error anywhere.
          test "$(ls apps/web/dist/assets/pdf.worker.min-*.mjs | wc -l)" -eq 1
          grep -qE 'pdf\.worker\.min-[A-Za-z0-9_-]+\.mjs' apps/web/dist/sw.js
