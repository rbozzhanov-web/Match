name: CI

on:
  push:
    branches: [main, 'claude/**', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Verify PWA output
        run: |
          test -f apps/web/dist/manifest.webmanifest
          test -f apps/web/dist/sw.js
          test -f apps/web/dist/icon-512.png
          grep -q 'serviceWorker' apps/web/dist/index.html
